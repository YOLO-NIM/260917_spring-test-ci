# master 브랜치 푸시 시 동작하는 CI 워크플로우
# Continuous Integration : 지속적 통합
name: CI

# 어떤 조건에서 트리거 될 것인가?
on:
  # 푸시 되면
  push:
    # master 브랜치에서
    branches:
      - master # master 브랜치 푸시만 감지

# GHCR 푸시를 위한 최소 권한 부여
permissions:
  contents: read # 소스 코드 읽기
  packages: write # ghcr.io 이미지 푸시

# 어떤 작업들을 할 것인가?
jobs:
  # 작업 이름
  hello:
    # 작업별로 환경변수나 다른 설정...
    # linux나 macos 같은 os를 지정
    runs-on: ubuntu-latest # 우분투 환경에서 실행
    # 작업의 단계를 나눔
    steps:
      # 작업의 이름
      - name: Print hello message
        # run: 직접 명령어를 통해서 실행
        run: echo "hello ci!" # 인사 메시지 출력
        # action : 이미 정의된 다른 작업에 설정값이나 매개변수를 제공해서 실행

  # gradle test 통과 여부를 검증하는 작업
  test:
    # hello 작업과 독립적으로 병렬 실행됨
    runs-on: ubuntu-latest # 우분투 환경에서 실행
    steps:
      # 러너는 매번 새로 생성되어 코드가 없음
      - name: Checkout source code
        # v7 : pwn request 방지 등 보안 강화 버전
        uses: actions/checkout@v7 # 커밋 시점 소스 코드 가져오기

      # 러너 기본 이미지엔 JDK 미설치 상태
      - name: Set up JDK 17
        # v6 : ESM 전환, 최신 배포판 지원 버전
        uses: actions/setup-java@v6
        with:
          java-version: '17' # 프로젝트와 동일한 JDK 버전
          distribution: 'temurin' # Adoptium Temurin 배포판

      # 저장소 내 스크립트는 실행 권한이 유실됨
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew # gradlew 실행 권한 재부여

      # 실패 시 종료 코드가 0이 아니어서 잡 실패 처리됨
      - name: Run Gradle tests
        run: ./gradlew test # 전체 테스트 실행 및 통과 검증

      # 테스트 실패해도 보고서는 남겨야 원인 파악 가능
      - name: Upload test HTML report
        if: always() # 성공/실패 상관없이 항상 업로드
        # v7 : 압축 방식 개선된 최신 업로드 액션
        uses: actions/upload-artifact@v7
        with:
          name: test-report # Actions 탭에서 표시될 이름
          path: build/reports/tests/test # gradle test HTML 보고서 경로

  # 테스트 통과한 커밋만 이미지로 빌드/배포
  build-and-push:
    # test 작업 성공해야만 실행됨
    needs: test
    runs-on: ubuntu-latest # 우분투 환경에서 실행
    steps:
      # 러너는 매번 새로 생성되어 코드가 없음
      - name: Checkout source code
        uses: actions/checkout@v7 # 커밋 시점 소스 코드 가져오기

      # amd64 러너에서 arm64 명령어 실행 지원
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4 # 크로스플랫폼 에뮬레이션 준비

      # 멀티플랫폼 빌드용 buildx 빌더 생성
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # buildx 빌더 컨텍스트 구성

      # GITHUB_TOKEN은 워크플로우에 내장된 시크릿
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io # GitHub Container Registry 주소
          username: ${{ github.actor }} # 워크플로우 실행 계정
          password: ${{ secrets.GITHUB_TOKEN }} # 별도 생성 없이 자동 발급되는 시크릿

      # ghcr 이미지 경로는 소문자만 허용됨
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # 대문자 포함 경로 대비

      # sha, latest 태그를 자동으로 계산
      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }} # 소문자 레포지토리 기준 경로
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64/arm64 동시 빌드 후 GHCR로 푸시
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: . # Dockerfile 위치 기준 경로
          platforms: linux/amd64,linux/arm64 # 크로스플랫폼 빌드 대상
          push: true # 빌드 후 레지스트리로 푸시
          tags: ${{ steps.meta.outputs.tags }} # sha, latest 태그 적용
          labels: ${{ steps.meta.outputs.labels }} # 메타데이터 라벨 부착