name: Gradle Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 저장소 코드를 워커에 내려받음
      - name: Checkout repository
        uses: actions/checkout@v7

      # JDK17 환경 구성 및 캐시 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 실행 환경 준비 및 빌드 캐시
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 단위 테스트 실행으로 통과 여부 검증
      - name: Run tests
        run: ./gradlew test

      # 실패 시 분석용 테스트 리포트 업로드
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
